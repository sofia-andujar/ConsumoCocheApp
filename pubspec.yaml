name: calculadora_consumo_app
description: Una app Flutter para registrar repostajes de coche con almacenamiento local.
publish_to: 'none'
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  sqflite: ^2.2.8
  path_provider: ^2.0.16
  path: ^1.8.3
  intl: ^0.20.2
  fl_chart: ^1.2.0
  shared_preferences: ^2.2.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  excel: ^2.0.0
  sqlite3: ^2.1.0

flutter:
  generate: true
  uses-material-design: true
